apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: selfhealingworkloads.ops.example.com
spec:
  group: ops.example.com
  scope: Namespaced
  names:
    plural: selfhealingworkloads
    singular: selfhealingworkload
    kind: SelfHealingWorkload
    shortNames:
      - shw
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [replicas, image]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 50
                image:
                  type: string
                  minLength: 1
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 80
                retryPolicy:
                  type: object
                  properties:
                    maxRetries:
                      type: integer
                      minimum: 0
                      maximum: 20
                      default: 3
                    backoffSeconds:
                      type: integer
                      minimum: 1
                      maximum: 3600
                      default: 30
                agentPolicy:
                  type: object
                  properties:
                    allowReadOnlyEvidence:
                      type: boolean
                      default: true
                    requireApprovalForRecovery:
                      type: boolean
                      default: true
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                  minimum: 0
                desiredReplicas:
                  type: integer
                  minimum: 0
                lastDiagnosis:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}

